name: Publish plugins
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate and build the index
        run: mkdir "$RUNNER_TEMP/out" && python3 tools/build_index.py --out "$RUNNER_TEMP/out/index.json" --releases "$RUNNER_TEMP/releases.json"
      - name: Release new plugin versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/releases.sh publish "$RUNNER_TEMP/releases.json"
      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/out/index.json" | base64 -w0 > "$RUNNER_TEMP/out/index.json.sig"
          rm "$RUNNER_TEMP/key.pem"
      - name: Push to index branch
        run: |
          git checkout --orphan index
          git rm -rfq .
          cp "$RUNNER_TEMP/out/index.json" "$RUNNER_TEMP/out/index.json.sig" .
          git add index.json index.json.sig
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Index $GITHUB_RUN_NUMBER"
          git push --force origin index
