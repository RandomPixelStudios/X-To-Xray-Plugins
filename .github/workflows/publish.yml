name: Publish signed index
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: mkdir "$RUNNER_TEMP/out" && python3 tools/build_index.py --out "$RUNNER_TEMP/out/index.json"
      - name: Upload new plugin versions (download counter)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view plugins >/dev/null 2>&1 || gh release create plugins --title "Plugin downloads" --notes "Plugin files. Download counts come from here."
          existing=$(gh release view plugins --json assets --jq '.assets[].name')
          for file in plugins/*.lua; do
            id=$(basename "$file" .lua)
            version=$(python3 -c "import json,sys; s=open(sys.argv[1],encoding='utf-8').read(); print(json.loads(s[len('--[[xtoxray'):s.find(']]')])['version'])" "$file")
            asset="$id-$version.lua"
            if ! printf '%s\n' "$existing" | grep -qx "$asset"; then
              cp "$file" "$RUNNER_TEMP/$asset"
              gh release upload plugins "$RUNNER_TEMP/$asset"
            fi
          done
      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/out/index.json" | base64 -w0 > "$RUNNER_TEMP/out/index.json.sig"
          rm "$RUNNER_TEMP/key.pem"
      - name: Push to index branch
        run: |
          git checkout --orphan index
          git rm -rfq .
          cp "$RUNNER_TEMP/out/index.json" "$RUNNER_TEMP/out/index.json.sig" .
          git add index.json index.json.sig
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Index $GITHUB_RUN_NUMBER"
          git push --force origin index
